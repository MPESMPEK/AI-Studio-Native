name: Multi-Platform Release (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: BUILD ANDROID APK
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/*.apk ../dist-android/AI-Studio-Mobile.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Mobile-APK
          path: dist-android/AI-Studio-Mobile.apk

  # ========================================================
  # JOB 2: BUILD WINDOWS STANDALONE BINARY PACKAGE
  # ========================================================
  build-windows:
    name: Package Windows Standalone x64
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup GCC / MinGW x64
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Compile AI-Studio.exe & engine_core.dll (-O3 SIMD)
        shell: msys2 {0}
        run: |
          mkdir -p cpp_core/obj cpp_core/bin dist-windows
          g++ -O3 -mavx2 -mfma -fopenmp -shared -DBUILDING_ENGINE_CORE_DLL -Icpp_core/include cpp_core/src/engine_core.cpp cpp_core/src/image_motion.cpp -o dist-windows/engine_core.dll -lpsapi
          
          # Compile ImGui object files
          g++ -O3 -mavx2 -mfma -fopenmp -c cpp_core/imgui/imgui.cpp -o cpp_core/obj/imgui.o
          g++ -O3 -mavx2 -mfma -fopenmp -c cpp_core/imgui/imgui_draw.cpp -o cpp_core/obj/imgui_draw.o
          g++ -O3 -mavx2 -mfma -fopenmp -c cpp_core/imgui/imgui_tables.cpp -o cpp_core/obj/imgui_tables.o
          g++ -O3 -mavx2 -mfma -fopenmp -c cpp_core/imgui/imgui_widgets.cpp -o cpp_core/obj/imgui_widgets.o
          g++ -O3 -mavx2 -mfma -fopenmp -c cpp_core/imgui/imgui_impl_win32.cpp -o cpp_core/obj/imgui_impl_win32.o
          g++ -O3 -mavx2 -mfma -fopenmp -c cpp_core/imgui/imgui_impl_dx11.cpp -o cpp_core/obj/imgui_impl_dx11.o
          
          # Compile Subsystem objects
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/hardware_detector.cpp -o cpp_core/obj/hardware_detector.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/model_manager.cpp -o cpp_core/obj/model_manager.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/prompt_engine.cpp -o cpp_core/obj/prompt_engine.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/memory_manager.cpp -o cpp_core/obj/memory_manager.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/hardware_telemetry.cpp -o cpp_core/obj/hardware_telemetry.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/engine_core.cpp -o cpp_core/obj/engine_core.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/image_motion.cpp -o cpp_core/obj/image_motion.o
          g++ -O3 -mavx2 -mfma -fopenmp -DSTATIC_ENGINE_CORE -Icpp_core/include -Icpp_core/imgui -c cpp_core/src/gui_main.cpp -o cpp_core/obj/gui_main.o

          # Link AI-Studio.exe single binary
          g++ -mwindows -s cpp_core/obj/*.o -ld3d11 -ldxgi -lgdi32 -ld3dcompiler -ldwmapi -lshell32 -lpsapi -lole32 -ladvapi32 -fopenmp -lcomdlg32 -lwinmm -o dist-windows/AI-Studio.exe

      - name: Package Distribution (Zero C++ Source Files)
        shell: pwsh
        run: |
          # Copy essential directories without raw C++ code
          New-Item -ItemType Directory -Path dist-windows/models/Teks_LLM -Force
          New-Item -ItemType Directory -Path dist-windows/models/Gambar_Diffusion -Force
          New-Item -ItemType Directory -Path dist-windows/models/VAE -Force
          New-Item -ItemType Directory -Path dist-windows/models/LoRA -Force
          New-Item -ItemType Directory -Path dist-windows/models/ControlNet -Force
          New-Item -ItemType Directory -Path dist-windows/outputs -Force
          
          if (Test-Path tools) { Copy-Item -Recurse tools dist-windows/ }
          if (Test-Path llama_bin) { Copy-Item -Recurse llama_bin dist-windows/ }
          if (Test-Path sd_bin) { Copy-Item -Recurse sd_bin dist-windows/ }
          Copy-Item LICENSE dist-windows/
          Copy-Item README.md dist-windows/

          # Create standalone zip archive
          Compress-Archive -Path dist-windows/* -DestinationPath AI-Studio-Windows-x64.zip -Force

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Windows-x64-ZIP
          path: AI-Studio-Windows-x64.zip

  # ========================================================
  # JOB 3: PUBLISH TO GITHUB RELEASES (AUTOMATIC RELEASE)
  # ========================================================
  release:
    name: Publish Official GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Studio-Mobile-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Studio-Windows-x64-ZIP
          path: release-assets

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Studio Official Release (${{ github.ref_name }})"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/AI-Studio-Windows-x64.zip
            release-assets/AI-Studio-Mobile.apk
          body: |
            ## 🚀 AI Studio Official Release
            Rilis resmi biner siap pakai untuk **Windows x64** dan **Android Mobile**:

            ### 📦 Aset Rilis (Download Siap Pakai):
            1. **`AI-Studio-Windows-x64.zip`**:
               - Paket aplikasi desktop mandiri siap klik (berisi `AI-Studio.exe`, `engine_core.dll`, runner native, dan tools).
               - **Tanpa perlu mengompilasi kode sumber C++!** Langsung ekstrak dan jalankan.
            2. **`AI-Studio-Mobile.apk`**:
               - File APK mandiri yang siap langsung dipasang (*install*) di HP Android.
               - Mendukung konektivitas nirkabel LAN WiFi ke laptop studio.

            ---

            ### 🔒 Ketentuan Lisensi & Perlindungan Hak Cipta
            - **Hak Cipta (c) 2026 MPESMPEK. All Rights Reserved.**
            - **Klausul Anti-AI**: DILARANG KERAS menggunakan biner, kode sumber, atau aset software ini untuk melatih, menyempurnakan, atau di-scrape oleh kecerdasan buatan (AI/LLM) pihak ketiga.
            - **Larangan Modifikasi**: Dilarang mengedit, merekayasa balik (*reverse engineer*), atau membajak lisensi kepemilikan software ini. Pelanggaran akan berakibat pemblokiran akses lisensi secara permanen.
