name: Build Android APK & Attach to Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AI Studio Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          mkdir -p ../dist-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../dist-apk/AI-Studio-Mobile.apk \;

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Mobile-APK
          path: dist-apk/AI-Studio-Mobile.apk

      - name: Attach APK to GitHub Release v1.4.0
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.4.0
          files: dist-apk/AI-Studio-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
