name: Build AI Studio Mobile Flutter APK (S24 Ultra arm64)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android_flutter/**'
      - '.github/workflows/build-android-flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AI Studio Mobile Flutter APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Fetch Prebuilt Stable Diffusion Native Libraries (arm64-v8a)
        working-directory: android_flutter/android/app/src/main/jniLibs/arm64-v8a
        run: |
          BASE_URL="https://raw.githubusercontent.com/rmatif/Local-Diffusion/main/android/app/src/main/jniLibs/arm64-v8a"
          for f in libstable-diffusion.so libstable-diffusion_opencl.so libstable-diffusion_vulkan.so; do
            if [ ! -f "$f" ]; then
              curl -fSL -o "$f" "$BASE_URL/$f"
            fi
          done

      - name: Get Flutter Dependencies
        working-directory: android_flutter
        run: flutter pub get

      - name: Build Release APK (arm64-v8a for Galaxy S24 Ultra)
        working-directory: android_flutter
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK Artifact
        run: |
          mkdir -p dist-apk-flutter
          cp android_flutter/build/app/outputs/flutter-apk/app-release.apk dist-apk-flutter/AI-Studio-Mobile-S24Ultra-arm64.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Mobile-S24Ultra-APK
          path: dist-apk-flutter/AI-Studio-Mobile-S24Ultra-arm64.apk
